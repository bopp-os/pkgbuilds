name: Build Packages & Publish Repo

on:
  push:
    paths: ['packages/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to rebuild (leave empty for all changed)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect-changes:
    runs-on: [self-hosted, x86-64-v3]
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: detect
        run: |
          if [[ -n "${{ inputs.package }}" ]]; then
            # Manual dispatch with specific package
            echo "packages=[\"${{ inputs.package }}\"]" >> "$GITHUB_OUTPUT"
          else
            # Get packages changed in this push
            changed=$(git diff --name-only HEAD~1 HEAD -- 'packages/**/PKGBUILD' \
              | sed 's|packages/\([^/]*\)/.*|\1|' | sort -u | jq -R . | jq -sc .)
            echo "packages=$changed" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: [self-hosted, x86-64-v3]
    container:
      image: cachyos/cachyos-v3:latest   # CachyOS x86-64-v3 container
      options: --privileged               # needed for fakeroot/makepkg
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm base-devel git

      - name: Create build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder packages/${{ matrix.package }}

      - name: Build package
        run: |
          cd packages/${{ matrix.package }}
          sudo -u builder makepkg -s --noconfirm --noprogressbar
          
          # Verify we got a package
          ls -la *.pkg.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}
          path: packages/${{ matrix.package }}/*.pkg.tar.zst
          retention-days: 7

  publish-repo:
    needs: build
    runs-on: [self-hosted, x86-64-v3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages          # repo DB lives here
          path: repo

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: new-pkgs
          merge-multiple: true

      - name: Update pacman repo database
        run: |
          sudo apt-get install -y libarchive-tools  # for bsdtar

          # Install repo-add from Arch tools (via docker)
          docker run --rm \
            -v "$PWD/repo:/repo" \
            -v "$PWD/new-pkgs:/new-pkgs" \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm pacman && \
              cp /new-pkgs/*.pkg.tar.zst /repo/ && \
              cd /repo && \
              repo-add --verify --sign=no bopp-os.db.tar.gz *.pkg.tar.zst
            "

      - name: Push updated repo to gh-pages
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: add/update packages from build ${{ github.run_id }}" || echo "Nothing to commit"
          git push