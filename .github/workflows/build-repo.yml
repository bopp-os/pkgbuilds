name: Build Packages & Publish Repo

on:
  push:
    paths: ['packages/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to rebuild (leave empty for all changed)'
        required: false
      build_all:
        description: 'Force rebuild of ALL packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect-changes:
    runs-on: [self-hosted, x86-64-v3]
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Clean root-owned files from previous build
        run: sudo rm -rf /opt/github-runner/_work/pkgbuilds/pkgbuilds/built-pkgs

      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: detect
        run: |
          if [[ "${{ inputs.build_all }}" == "true" ]]; then
            all_pkgs=$(git ls-files 'packages/**/PKGBUILD' \
              | sed 's|packages/\([^/]*\)/.*|\1|' | sort -u | jq -R . | jq -sc .)
            echo "packages=$all_pkgs" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.package }}" ]]; then
            echo "packages=[\"${{ inputs.package }}\"]" >> "$GITHUB_OUTPUT"
          else
            # If only one commit exists, diff against empty tree
            if git rev-parse HEAD~1 &>/dev/null; then
              base="HEAD~1"
            else
              base="$(git hash-object -t tree /dev/null)"
            fi

            changed_dirs=$(git diff --name-only "$base" HEAD -- 'packages/' \
              | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)

            changed_pkgs=()
            for pkg in $changed_dirs; do
              if [[ -f "packages/$pkg/PKGBUILD" ]]; then
                changed_pkgs+=("$pkg")
              fi
            done

            if [[ ${#changed_pkgs[@]} -eq 0 ]]; then
              changed="[]"
            else
              changed=$(printf '%s\n' "${changed_pkgs[@]}" | jq -R . | jq -sc .)
            fi

            echo "packages=$changed" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: [self-hosted, x86-64-v3]
    container:
      image: cachyos/cachyos-v3:latest   # CachyOS x86-64-v3 container
      options: --privileged               # needed for fakeroot/makepkg
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm base-devel git

      - name: Create build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          for pkg in ${{ matrix.package }}; do
            chown -R builder:builder "packages/$pkg"
          done
      
      - name: Import PGP keys
        run: |
          keys=$(sudo -u builder bash -c "
            source packages/${{ matrix.package }}/PKGBUILD
            echo \${validpgpkeys[@]}
          ")
          if [[ -n "$keys" ]]; then
            for key in $keys; do
              sudo -u builder gpg --keyserver keyserver.ubuntu.com --recv-keys "$key" || \
              sudo -u builder gpg --keyserver hkps://keys.openpgp.org --recv-keys "$key" || \
              sudo -u builder gpg --keyserver hkps://pgp.mit.edu --recv-keys "$key" || true
            done
          fi

      - name: Build package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/built-pkgs"
          for pkg in ${{ matrix.package }}; do
            cd "$GITHUB_WORKSPACE/packages/$pkg"
            sudo -u builder makepkg -s --noconfirm --noprogressbar
            
            # Verify we got a package
            ls -la *.pkg.tar.zst
            cp *.pkg.tar.zst "$GITHUB_WORKSPACE/built-pkgs/"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.package }}
          path: built-pkgs/*.pkg.tar.zst
          retention-days: 7

      - name: Clean build artifacts
        if: always()
        run: |
          # Fix ownership so the runner can clean up on next run
          chown -R $(stat -c %u /opt/github-runner/_work) \
            /opt/github-runner/_work/pkgbuilds/ 2>/dev/null || true

  publish-repo:
    needs: build
    runs-on: [self-hosted, x86-64-v3]   # already on proxima-a, no SSH needed
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: new-pkgs
          merge-multiple: true

      - name: Update pacman repo database
        run: |
          REPO_DIR=/var/www/pacman-repo
          cp new-pkgs/*.pkg.tar.zst "$REPO_DIR/"
          cd "$REPO_DIR"
          repo-add bopp-os.db.tar.gz *.pkg.tar.zst