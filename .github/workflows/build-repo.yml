name: Build Packages & Publish Repo

on:
  push:
    paths: ['packages/**']
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to rebuild (leave empty for all changed)'
        required: false
      build_all:
        description: 'Force rebuild of ALL packages'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: [self-hosted, x86-64-v3]
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - name: Clean root-owned files from previous build
        run: sudo rm -rf /opt/github-runner/_work/pkgbuilds/pkgbuilds/built-pkgs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed packages
        id: detect
        env:
          BUILD_ALL: ${{ inputs.build_all }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$BUILD_ALL" == "true" ]]; then
            all_pkgs=$(git ls-files 'packages/**/PKGBUILD' 'packages/**/.upstream-ref' \
              | sed 's|packages/\([^/]*\)/.*|\1|' | sort -u | jq -R . | jq -sc .)
            echo "packages=$all_pkgs" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_PACKAGE" ]]; then
            if [[ ! "$INPUT_PACKAGE" =~ ^[A-Za-z0-9@._+-]+$ || ! -d "packages/$INPUT_PACKAGE" ]]; then
              echo "::error::'$INPUT_PACKAGE' is not a package folder under packages/"
              exit 1
            fi
            echo "packages=[\"$INPUT_PACKAGE\"]" >> "$GITHUB_OUTPUT"
          else
            # If only one commit exists, diff against empty tree
            if git rev-parse HEAD~1 &>/dev/null; then
              base="HEAD~1"
            else
              base="$(git hash-object -t tree /dev/null)"
            fi

            changed_dirs=$(git diff --name-only "$base" HEAD -- 'packages/' \
              | sed -n 's|^packages/\([^/]*\)/.*|\1|p' | sort -u)

            changed_pkgs=()
            for pkg in $changed_dirs; do
              if [[ -f "packages/$pkg/PKGBUILD" || -f "packages/$pkg/.upstream-ref" ]]; then
                changed_pkgs+=("$pkg")
              fi
            done

            if [[ ${#changed_pkgs[@]} -eq 0 ]]; then
              changed="[]"
            else
              changed=$(printf '%s\n' "${changed_pkgs[@]}" | jq -R . | jq -sc .)
            fi

            echo "packages=$changed" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: [self-hosted, x86-64-v3]
    container:
      image: cachyos/cachyos-v3:latest   # CachyOS x86-64-v3 container
      options: --privileged               # needed for fakeroot/makepkg
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add the bopp-os repository
        # Packages here can depend on each other (litterbox-sandbox-addons needs litterbox-sandbox), and `makepkg -s` only
        # installs dependencies from the repositories pacman knows. Appended last so Arch and CachyOS packages keep priority.
        # The key comes from this checkout (keys/boppos.gpg), not from the network, and packages must be signed by it.
        # Best effort: if the repository cannot be had, the job carries on exactly as before and only a package that really
        # needs something from this repository fails.
        run: |
          # Fingerprint of the repository signing key (also pinned in bopp-os/cachyos scripts/setup_pacman_repos.sh).
          want=3806768589376830FEA123D6CF30985CE903D47C
          if grep -q '^\[bopp-os\]' /etc/pacman.conf; then echo "bopp-os repository already configured"; exit 0; fi
          fpr=$(gpg --with-colons --show-keys keys/boppos.gpg | awk -F: '/^fpr/ {print $10; exit}')
          if [ "$fpr" != "$want" ]; then
            echo "::warning::bopp-os repository key is $fpr, expected $want; building without that repository"; exit 0
          fi
          if ! pacman-key --add keys/boppos.gpg || ! pacman-key --lsign-key "$fpr"; then
            echo "::warning::could not import the bopp-os repository key; building without that repository"; exit 0
          fi
          printf '\n[bopp-os]\nSigLevel = Required DatabaseOptional\nServer = https://repo.ripps.me\n' >> /etc/pacman.conf
          echo "Added the bopp-os repository (key $fpr)"

      - name: Install build deps
        run: |
          pacman -Syu --noconfirm base-devel git

      - name: Fetch the files of link-only packages
        run: |
          # A package folder with only .upstream-url/.upstream-path/.upstream-ref has no PKGBUILD in this repo:
          # its files live in another repo, at the release tag pinned in .upstream-ref (changed only by a reviewed PR).
          set -euo pipefail
          for pkg in ${{ matrix.package }}; do
            dir="packages/$pkg"
            if [[ -f "$dir/PKGBUILD" || ! -f "$dir/.upstream-ref" ]]; then continue; fi
            url=$(tr -d '[:space:]' < "$dir/.upstream-url")
            path=$(tr -d '[:space:]' < "$dir/.upstream-path")
            ref=$(tr -d '[:space:]' < "$dir/.upstream-ref")
            if [[ ! "$url" =~ ^https://github\.com/[^/]+/[^/]+/?$ || ! "$path" =~ ^[A-Za-z0-9_-]+$ || ! "$ref" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::$pkg: unusable .upstream-url, .upstream-path or .upstream-ref"
              exit 1
            fi
            tmp=$(mktemp -d)
            git clone --quiet --depth 1 --branch "$ref" "$url" "$tmp"
            if [[ ! -f "$tmp/$path/PKGBUILD" ]]; then
              echo "::error::$pkg: $url at $ref has no $path/PKGBUILD"
              exit 1
            fi
            cp -r "$tmp/$path/." "$dir/"
            rm -rf "$tmp"
            echo "Fetched $pkg from $url at $ref"
          done

      - name: Create build user (makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          for pkg in ${{ matrix.package }}; do
            chown -R builder:builder "packages/$pkg"
          done

      - name: Check the integrity of the package sources
        # The PKGBUILD is sourced, which runs its top-level code: as the unprivileged builder, like makepkg itself.
        run: |
          for pkg in ${{ matrix.package }}; do
            sudo -u builder bash scripts/check-sources.sh "packages/$pkg"
          done

      - name: Import PGP keys for sources
        # Upstream signing keys are committed in keys/pgp/<fingerprint>.asc and checked against that fingerprint here: no
        # keyserver is involved, and a missing or mismatching key fails the build.
        run: |
          set -euo pipefail
          for pkg in ${{ matrix.package }}; do
            keys=$(sudo -u builder bash -c 'source "packages/$1/PKGBUILD"; echo "${validpgpkeys[@]}"' _ "$pkg")
            for key in $keys; do
              file="keys/pgp/$key.asc"
              if [[ ! -f "$file" ]]; then
                echo "::error::$pkg: validpgpkeys lists $key but $file is not in the repository"
                exit 1
              fi
              have=$(gpg --with-colons --show-keys "$file" | awk -F: '/^fpr/ {print $10; exit}')
              if [[ "$have" != "$key" ]]; then
                echo "::error::$file holds key $have, not $key"
                exit 1
              fi
              sudo -u builder gpg --batch --import "$file"
            done
          done

      - name: Look for Rust packages (cargo cache)
        id: cargo
        env:
          PKG: ${{ matrix.package }}
        run: |
          # A Rust package downloads and compiles hundreds of crates from scratch on every run (litterbox-sandbox: ~17 minutes),
          # so its cargo state lives in the GitHub Actions cache. CARGO_HOME (crate downloads) is safe for any package.
          # CARGO_TARGET_DIR moves the build output, so only a PKGBUILD that mentions it (and looks for its binaries there) opts in.
          if grep -q cargo "packages/$PKG/PKGBUILD"; then
            echo "use=true" >> "$GITHUB_OUTPUT"
            echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo-cache/home" >> "$GITHUB_ENV"
            if grep -q CARGO_TARGET_DIR "packages/$PKG/PKGBUILD"; then
              echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/.cargo-cache/target" >> "$GITHUB_ENV"
            fi
          fi

      - name: Restore the cargo cache
        id: cargo-cache
        if: steps.cargo.outputs.use == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-cache
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package), format('packages/{0}/.upstream-ref', matrix.package)) }}
          restore-keys: cargo-${{ matrix.package }}-

      - name: Prepare the cargo directories
        if: steps.cargo.outputs.use == 'true'
        run: |
          mkdir -p .cargo-cache/home .cargo-cache/target
          chown -R builder:builder .cargo-cache

      - name: Build package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/built-pkgs"
          for pkg in ${{ matrix.package }}; do
            cd "$GITHUB_WORKSPACE/packages/$pkg"
            # sudo drops the environment: keep the cargo directories chosen above
            # Not signed here: the build job runs the PKGBUILD's code and never sees the signing key. The publish job signs
            # the packages that passed the scan.
            sudo -u builder --preserve-env=CARGO_HOME,CARGO_TARGET_DIR makepkg -s --noconfirm --noprogressbar

            ls -la *.pkg.tar.zst
            cp *.pkg.tar.zst "$GITHUB_WORKSPACE/built-pkgs/"
          done

      # Saved only after a successful build, and not again when the exact key was already restored. A new version gets a new
      # key, starts from the previous version's cache (restore-keys) and saves its own; GitHub evicts old entries by itself.
      - name: Save the cargo cache
        if: steps.cargo.outputs.use == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cargo-cache
          key: cargo-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/PKGBUILD', matrix.package), format('packages/{0}/.upstream-ref', matrix.package)) }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.package }}
          path: built-pkgs/*
          retention-days: 7

      - name: Clean build artifacts
        if: always()
        run: |
          # The cache lives on GitHub; do not leave a copy on the runner's disk
          rm -rf "$GITHUB_WORKSPACE/.cargo-cache" || true
          # The packages are already uploaded as an artifact
          rm -rf "$GITHUB_WORKSPACE/built-pkgs" || true
          # This job runs as root in a container, where the runner's work folder is mounted at /__w, not at its host path
          # /opt/github-runner/_work. Hand the workspace back to the runner's user (the owner of the folder above it), or
          # the next host job's checkout (scan) cannot delete the files left here.
          owner=$(stat -c %u:%g "$GITHUB_WORKSPACE/..")
          chown -R "$owner" "$GITHUB_WORKSPACE" || true

  scan:
    needs: [detect-changes, build]
    # Runs on every branch, so a flagged package shows up on the PR before anything is merged.
    if: always() && !cancelled() && needs.detect-changes.outputs.packages != '[]'
    # No job container: the ClamAV image is Alpine, where the JavaScript actions (download-artifact) cannot run.
    runs-on: [self-hosted, x86-64-v3]
    outputs:
      clean: ${{ steps.clamscan.outputs.clean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Merged, so the layout is the same flat folder whether one artifact or several match (download-artifact skips the
      # per-artifact folder when there is only one).
      - name: Download all built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: scan-pkgs
          merge-multiple: true

      - name: Unpack the packages
        # ClamAV does not reliably look inside zstd archives, so it scans the unpacked files next to each package.
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p scan-pkgs
          for pkg in scan-pkgs/*.pkg.tar.zst; do
            out="${pkg%.pkg.tar.zst}.unpacked"
            mkdir -p "$out"
            bsdtar -xf "$pkg" -C "$out"
          done

      - name: Scan with ClamAV
        id: clamscan
        # The image ships with the current signature database; --pull always fetches the newest one. The runner's Docker
        # remaps user ids, so the container cannot write any host file (not GitHub's output files, not a mounted folder):
        # the workspace is mounted read-only, the script writes its outputs to /tmp inside the container, and they come
        # back on stdout after a marker line while the scan log goes to stderr.
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/clamscan.txt"
          docker run --rm --pull always -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            -e GITHUB_OUTPUT=/tmp/output -e GITHUB_STEP_SUMMARY=/tmp/summary --entrypoint /bin/sh clamav/clamav:stable \
            -c 'set -e; touch /tmp/output /tmp/summary; sh scripts/clamscan-pkgs.sh scan-pkgs >&2
                echo "=== output"; cat /tmp/output; echo "=== summary"; cat /tmp/summary' > "$results"
          sed -n '/^=== output$/,/^=== summary$/{/^===/d;p}' "$results" >> "$GITHUB_OUTPUT"
          sed -n '/^=== summary$/,${/^===/d;p}' "$results" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$results"

      - name: Fail if anything was flagged
        if: steps.clamscan.outputs.flagged != '0'
        env:
          FLAGGED: ${{ steps.clamscan.outputs.flagged }}
        run: |
          echo "::error::${FLAGGED:-the scan} package(s) flagged or not scanned; see the job summary. Only clean packages are published."
          exit 1

      - name: Clean up
        if: always()
        run: |
          # Packages can contain read-only directories
          chmod -R u+rwX scan-pkgs 2>/dev/null || true
          rm -rf scan-pkgs

      - name: Remove old ClamAV images
        if: always()
        # --pull always leaves the previous clamav/clamav:stable behind untagged after each database update. This removes
        # untagged images only, so nothing another workload on the host still uses by tag is touched.
        run: docker image prune -f

  publish-repo:
    needs: [detect-changes, build, scan]
    # Only main publishes. A push to any other branch (a PR branch) still builds the packages as a test, but nothing is
    # copied to the live repository until the change is reviewed and merged.
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.packages != '[]'
    runs-on: [self-hosted, x86-64-v3]   # already on proxima-a, no SSH needed
    # The signing key (GPG_PRIVATE_KEY) is a secret of this environment, which only deploys from main. The build jobs
    # run PKGBUILD code and never see it; packages are signed here, after the scan.
    environment: publish
    env:
      # The BoppOS repository signing key; also pinned in bopp-os/cachyos scripts/setup_pacman_repos.sh.
      SIGNING_FPR: 3806768589376830FEA123D6CF30985CE903D47C
    steps:
      # Only the public key and the scripts: nothing else of the repository is needed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            keys
            scripts
          persist-credentials: false

      # The workspace keeps files from earlier runs: start empty, or an old unscanned package could be published.
      - name: Clear earlier downloads
        run: rm -rf dl-pkgs new-pkgs

      - name: Download all built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: dl-pkgs
          merge-multiple: true

      - name: Keep only packages the scan passed
        id: keep
        env:
          CLEAN: ${{ needs.scan.outputs.clean }}
        run: |
          # Fails closed: if the scan job did not run or found nothing clean, CLEAN is empty and nothing is published.
          # Signatures that came with the artifacts are never used: the packages are signed below.
          set -euo pipefail
          mkdir -p new-pkgs
          rejected=0
          shopt -s nullglob
          for pkg in dl-pkgs/*.pkg.tar.zst; do
            name=$(basename "$pkg")
            if [[ " $CLEAN " == *" $name "* && "$name" =~ ^[A-Za-z0-9@._+:-]+\.pkg\.tar\.zst$ ]]; then
              cp -a "$pkg" new-pkgs/
            else
              echo "::error::$name was not passed by the scan and will not be published"
              rejected=$((rejected + 1))
            fi
          done
          echo "rejected=$rejected" >> "$GITHUB_OUTPUT"
          rm -rf dl-pkgs

      - name: Check for packages to publish
        id: check-pkgs
        run: |
          if [[ -d new-pkgs && -n "$(ls -A new-pkgs/*.pkg.tar.zst 2>/dev/null)" ]]; then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "Found packages to publish:"
            ls -la new-pkgs/*.pkg.tar.zst
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "No packages were built successfully to publish."
          fi

      - name: Import GPG signing key
        # No condition: a missing or wrong key fails the run even when there is nothing to publish.
        # A throwaway GNUPGHOME, so the key never lands in the runner user's own keyring on this shared host.
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::GPG_PRIVATE_KEY is not available to this job; refusing to publish unsigned packages"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          rm -rf "$GNUPGHOME"
          install -d -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Primary fingerprints of all imported secret keys: exactly one, and it must be the repository key.
          secret=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {p=1; next} /^ssb/ {p=0} /^fpr/ && p {print $10; p=0}')
          if [[ "$secret" != "$SIGNING_FPR" ]]; then
            echo "::error::the secret key is '$secret', expected exactly $SIGNING_FPR"
            exit 1
          fi
          public=$(gpg --with-colons --show-keys keys/boppos.gpg | awk -F: '/^fpr/ {print $10; exit}')
          if [[ "$public" != "$SIGNING_FPR" ]]; then
            echo "::error::keys/boppos.gpg holds $public, expected $SIGNING_FPR"
            exit 1
          fi
          echo "GPG_KEY_ID=$SIGNING_FPR" >> "$GITHUB_ENV"
          echo "Imported the repository signing key $SIGNING_FPR"

      - name: Sign the packages
        if: steps.check-pkgs.outputs.has_packages == 'true'
        run: |
          set -euo pipefail
          for pkg in new-pkgs/*.pkg.tar.zst; do
            rm -f "$pkg.sig"
            gpg --batch --yes --detach-sign --no-armor --local-user "$GPG_KEY_ID!" -o "$pkg.sig" "$pkg"
          done

      - name: Verify the package signatures
        if: steps.check-pkgs.outputs.has_packages == 'true'
        run: bash scripts/verify-pkg-sigs.sh keys/boppos.gpg new-pkgs/*.pkg.tar.zst

      - name: Update pacman repo database
        if: steps.check-pkgs.outputs.has_packages == 'true'
        run: |
          set -euo pipefail
          REPO_DIR=/var/www/pacman-repo
          cp -a new-pkgs/* "$REPO_DIR/"

          # Only register the packages built in this run, in version order.
          # Passing the whole repo dir lets lexical glob order (1.0.10 < 1.0.2)
          # overwrite newer db entries with older versions.
          mapfile -t new_pkgs < <(find new-pkgs -maxdepth 1 -name '*.pkg.tar.zst' -printf '%f\n' | sort -V)
          echo "Registering packages:"
          printf '  %s\n' "${new_pkgs[@]}"

          cd "$REPO_DIR"
          echo "Signing repository database with key: $GPG_KEY_ID"
          repo-add --prevent-downgrade --sign --key "$GPG_KEY_ID" bopp-os.db.tar.gz "${new_pkgs[@]}"

          # The public key served to users is the verified one from this repository.
          cp "$GITHUB_WORKSPACE/keys/boppos.asc" "$GITHUB_WORKSPACE/keys/boppos.gpg" "$REPO_DIR/"

      - name: Verify the repository database signatures
        if: steps.check-pkgs.outputs.has_packages == 'true'
        run: bash scripts/verify-pkg-sigs.sh keys/boppos.gpg /var/www/pacman-repo/bopp-os.db.tar.gz /var/www/pacman-repo/bopp-os.files.tar.gz

      - name: Remove old package versions
        if: steps.check-pkgs.outputs.has_packages == 'true'
        # repo-add only updates the database; the old package files stay on disk. Keep the 5 newest versions of each
        # package (with their .sig files) so an older one can still be installed by URL. Cleanup never fails the publish.
        run: bash scripts/prune-old-pkgs.sh /var/www/pacman-repo 5 || echo "::warning::pruning failed; old package versions were not removed"

      - name: Remove the signing key from the runner
        if: always()
        run: |
          gpgconf --kill gpg-agent 2>/dev/null || GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill gpg-agent 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/gnupg"

      - name: Fail workflow if any build job failed
        if: needs.build.result != 'success'
        run: |
          echo "::error::One or more package builds failed in the matrix."
          exit 1

      - name: Fail workflow if the scan flagged or skipped anything
        if: needs.scan.result != 'success' || steps.keep.outputs.rejected != '0'
        run: |
          echo "::error::The ClamAV scan flagged a package or did not finish; flagged packages were not published."
          exit 1
