name: Check Upstream AUR Updates

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y git curl gettext-base

      - name: Check upstream AUR PKGBUILDs and open PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Ensure the upstream-update label exists in the repository
          gh label create "upstream-update" \
            --color "1d76db" \
            --description "Updates from upstream package sources" \
            --repo "$REPO" || true

          updated_packages=()

          for pkg_dir in packages/*/; do
            git checkout -f main
            pkg_name=$(basename "$pkg_dir")

            # Allow override via .upstream-name
            upstream_name="$pkg_name"
            if [[ -f "$pkg_dir/.upstream-name" ]]; then
              upstream_name=$(cat "$pkg_dir/.upstream-name" | tr -d '[:space:]')
            fi

            # Allow override via .upstream-path
            upstream_path=""
            if [[ -f "$pkg_dir/.upstream-path" ]]; then
              upstream_path=$(cat "$pkg_dir/.upstream-path" | tr -d '[:space:]')
            fi

            local_pkgbuild="$pkg_dir/PKGBUILD"
            if [[ ! -f "$local_pkgbuild" ]]; then
              echo "::warning::No PKGBUILD found for $pkg_name, skipping"
              continue
            fi

            upstream_url="https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=${upstream_name}"
            source_type="AUR"
            if [[ -f "$pkg_dir/.upstream-url" ]]; then
              upstream_url=$(cat "$pkg_dir/.upstream-url" | tr -d '[:space:]')
              
              if [[ ! "$upstream_url" =~ ^https?:// ]]; then
                echo "::warning::Invalid .upstream-url in $pkg_name: '$upstream_url' is not a valid URL. If you meant to override the AUR name, use .upstream-name instead."
                continue
              fi
              
              # Auto-convert GitHub repo URLs to point to the raw PKGBUILD on the default branch
              if [[ "$upstream_url" =~ ^https://github\.com/[^/]+/[^/]+/?$ ]]; then
                if [[ -n "$upstream_path" ]]; then
                  upstream_url="${upstream_url%/}/raw/HEAD/${upstream_path}/PKGBUILD"
                else
                  upstream_url="${upstream_url%/}/raw/HEAD/PKGBUILD"
                fi
              fi

              # Auto-convert AUR .git repository URLs to point to the raw cgit PKGBUILD
              if [[ "$upstream_url" =~ ^https://aur\.archlinux\.org/([^/]+)\.git/?$ ]]; then
                upstream_url="https://aur.archlinux.org/cgit/aur.git/plain/PKGBUILD?h=${BASH_REMATCH[1]}"
              fi

              source_type="Custom URL"
            fi

            echo "--- Checking $pkg_name ---"
            echo "  Source Type: $source_type"
            echo "  Target URL : $upstream_url"

            # Determine git URL if it's an AUR or Git repository
            git_url=""
            if [[ "$source_type" == "AUR" ]]; then
              git_url="https://aur.archlinux.org/${upstream_name}.git"
            elif [[ -f "$pkg_dir/.upstream-url" ]]; then
              orig_upstream_url=$(cat "$pkg_dir/.upstream-url" | tr -d '[:space:]')
              if [[ "$orig_upstream_url" =~ ^https://aur\.archlinux\.org/[^/]+\.git/?$ ]] || [[ "$orig_upstream_url" =~ ^https://github\.com/[^/]+/[^/]+/?$ ]] || [[ "$orig_upstream_url" =~ \.git$ ]]; then
                git_url="$orig_upstream_url"
              fi
            fi

            has_changes=0
            upstream_ver="unknown"

            if [[ -n "$git_url" ]]; then
              echo "  Cloning upstream Git repo: $git_url"
              clone_dir=$(mktemp -d)
              if git clone --depth 1 "$git_url" "$clone_dir" >/dev/null 2>&1; then
                upstream_pkgbuild_path="$clone_dir/PKGBUILD"
                if [[ -n "$upstream_path" ]]; then
                  upstream_pkgbuild_path="$clone_dir/$upstream_path/PKGBUILD"
                fi

                if [[ -f "$upstream_pkgbuild_path" ]]; then
                  # Compare PKGBUILD
                  if ! diff "$upstream_pkgbuild_path" "$local_pkgbuild" > /dev/null 2>&1; then
                    has_changes=1
                    upstream_ver=$(grep -m1 '^pkgver=' "$upstream_pkgbuild_path" | cut -d= -f2 || echo "unknown")
                  fi
                else
                  echo "::warning::No PKGBUILD found in cloned repo $git_url at path ${upstream_path:-PKGBUILD}"
                fi
              else
                echo "::warning::Failed to clone upstream Git repo $git_url"
              fi
            else
              # Fetch upstream PKGBUILD via curl
              upstream_pkgbuild=$(curl -fsSL "$upstream_url" 2>curl_err.txt || true)
              if [[ -z "$upstream_pkgbuild" ]]; then
                echo "::warning::Could not fetch upstream PKGBUILD for $pkg_name"
                echo "  Curl stderr:"
                cat curl_err.txt | sed 's/^/    /'
                rm -f curl_err.txt
                continue
              fi
              rm -f curl_err.txt

              # Validate it's a real PKGBUILD (prevents accidentally fetching HTML pages)
              if ! echo "$upstream_pkgbuild" | grep -q 'pkgver='; then
                echo "::warning::Fetched content for $upstream_name does not look like a valid PKGBUILD (missing pkgver=). Check .upstream-url to ensure it is a raw text link."
                continue
              fi

              # Compare
              if ! diff <(echo "$upstream_pkgbuild") "$local_pkgbuild" > /dev/null 2>&1; then
                has_changes=1
                upstream_ver=$(echo "$upstream_pkgbuild" | grep -m1 '^pkgver=' | cut -d= -f2 || echo "unknown")
              fi
            fi

            if [[ $has_changes -eq 0 ]]; then
              echo "  ✓ $pkg_name is up to date"
              [[ -n "$git_url" && -d "${clone_dir:-}" ]] && rm -rf "$clone_dir"
              continue
            fi

            echo "  ↑ $pkg_name has upstream changes"

            branch="upstream-update/${pkg_name}"

            # Delete stale branch if it exists (previous unmerged update)
            git push origin --delete "$branch" 2>/dev/null || true

            git checkout -b "$branch"

            # Apply changes
            if [[ -n "$git_url" ]]; then
              sync_src_dir="$clone_dir"
              if [[ -n "$upstream_path" ]]; then
                sync_src_dir="$clone_dir/$upstream_path"
              fi

              # Remove all non-dot files/directories in packages/<pkg>
              find "$pkg_dir" -mindepth 1 -maxdepth 1 ! -name ".*" -exec rm -rf {} +

              # Copy new/updated files
              cp -r "$sync_src_dir"/* "$pkg_dir/"
              rm -rf "$clone_dir"
            else
              # Write upstream PKGBUILD only
              echo "$upstream_pkgbuild" > "$local_pkgbuild"
            fi

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add "$pkg_dir"
            git commit -m "upstream($pkg_name): update to $upstream_ver"

            git push origin "$branch"

            # Build diff for PR body into a file to prevent "Argument list too long" (E2BIG)
            git diff HEAD~1 HEAD -- "$pkg_dir" > diff.txt || true

            export PKG_NAME="$pkg_name"
            
            if [[ "$source_type" == "AUR" ]]; then
              export SOURCE_INFO="**AUR package:** \`$upstream_name\`"$'\n'"**AUR PKGBUILD:** cgit"
            else
              export SOURCE_INFO="**Upstream source type:** \`Custom URL\`"$'\n'"**Upstream PKGBUILD:** Link"
            fi

            # Safely substitute ONLY our short variables
            envsubst '${PKG_NAME} ${SOURCE_INFO}' < .github/upstream-pr-template.md > pr_body_temp.md

            # Inject the multi-line diff directly from the file to avoid environment size limits
            sed -e '/\${DIFF_OUTPUT}/ {' -e 'r diff.txt' -e 'd' -e '}' pr_body_temp.md > pr_body.md

            gh pr create \
              --repo "$REPO" \
              --title "upstream($pkg_name): update to $upstream_ver" \
              --body-file pr_body.md \
              --base main \
              --head "$branch" \
              --label "upstream-update" \
              || echo "::warning::PR creation failed or already exists for $pkg_name"
          done